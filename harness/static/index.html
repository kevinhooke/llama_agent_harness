<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Chat</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dfe2e7;
    --text: #1d2129;
    --muted: #6b7280;
    --user-bg: #2f6fed;
    --user-text: #ffffff;
    --model1-bg: #ffffff;
    --model1-accent: #2f9e74;
    --model2-bg: #ffffff;
    --model2-accent: #b9651f;
    --error-bg: #fdecec;
    --error-text: #a12626;
    --focus: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --surface: #1e2128;
      --border: #2d313a;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --user-bg: #3d7bf2;
      --user-text: #ffffff;
      --model1-bg: #1e2128;
      --model1-accent: #4cc493;
      --model2-bg: #1e2128;
      --model2-accent: #e39a55;
      --error-bg: #3a1f22;
      --error-text: #f2a5a5;
      --focus: #6b9cf7;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; }
  .setting { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .setting .dot { width: 9px; height: 9px; border-radius: 50%; }
  select, input[type="number"] {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    max-width: 260px;
  }
  input[type="number"] { width: 64px; }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
  }
  .thread { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty p { margin: 4px 0; }

  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg .who { font-size: 12px; font-weight: 600; margin: 0 4px 3px; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .who { color: var(--muted); }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }

  .msg.model { align-self: flex-start; }
  .msg.model .bubble { border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.m0 .who { color: var(--model1-accent); }
  .msg.m0 .bubble { background: var(--model1-bg); border-left: 3px solid var(--model1-accent); }
  .msg.m1 .who { color: var(--model2-accent); }
  .msg.m1 .bubble { background: var(--model2-bg); border-left: 3px solid var(--model2-accent); }

  .msg.error { align-self: stretch; max-width: none; }
  .msg.error .bubble { background: var(--error-bg); color: var(--error-text); border-radius: 8px; }

  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.6; } }

  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
  }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    resize: none;
    max-height: 200px;
  }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--user-bg);
    color: var(--user-text);
  }
  button.stop { background: var(--error-text); }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

  @media (max-width: 600px) {
    .msg { max-width: 100%; }
    select { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>LLM Chat Room</h1>
  <label class="setting"><span class="dot" style="background: var(--model1-accent)"></span>Model 1
    <select id="model1"></select></label>
  <label class="setting"><span class="dot" style="background: var(--model2-accent)"></span>Model 2
    <select id="model2"></select></label>
  <label class="setting">Turns
    <input id="turns" type="number" min="1" max="50" value="2"></label>
</header>

<main id="scroller">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p><strong>Start a model-to-model conversation</strong></p>
      <p>Your prompt goes to Model 1, its reply goes to Model 2, and they take turns.</p>
    </div>
  </div>
</main>

<footer>
  <form id="composer">
    <textarea id="prompt" rows="1" placeholder="Enter an initial prompt…" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line · each prompt starts a new conversation</div>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const thread = $("thread");
  const scroller = $("scroller");
  const promptBox = $("prompt");
  const sendButton = $("send");

  let running = false;
  let controller = null;
  let conversations = 0;

  async function loadModels() {
    try {
      const res = await fetch("/api/models");
      const names = await res.json();
      for (const select of [$("model1"), $("model2")]) {
        for (const name of names) select.add(new Option(name, name));
      }
      // default to two different models when there are at least two
      if (names.length > 1) $("model2").selectedIndex = 1;
    } catch (err) {
      addError(`Could not load models: ${err.message}`);
    }
  }

  function scrollToEnd() {
    scroller.scrollTop = scroller.scrollHeight;
  }

  // all text is set with textContent so model output can't inject HTML
  function addMessage(kind, who, text, modelIndex) {
    $("empty")?.remove();
    const msg = document.createElement("div");
    msg.className = `msg ${kind}` + (kind === "model" ? ` m${modelIndex}` : "");
    const label = document.createElement("div");
    label.className = "who";
    label.textContent = who;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msg.append(label, bubble);
    thread.append(msg);
    scrollToEnd();
    return msg;
  }

  function addTyping(who, modelIndex) {
    const msg = addMessage("model", who, "", modelIndex);
    const bubble = msg.querySelector(".bubble");
    bubble.innerHTML = '<span class="typing" aria-label="thinking"><span></span><span></span><span></span></span>';
    return msg;
  }

  function addError(text) {
    addMessage("error", "Error", text);
  }

  function addDivider(text) {
    const div = document.createElement("div");
    div.className = "divider";
    div.textContent = text;
    thread.append(div);
  }

  function setRunning(value) {
    running = value;
    sendButton.textContent = value ? "Stop" : "Send";
    sendButton.classList.toggle("stop", value);
    sendButton.type = value ? "button" : "submit";
    promptBox.disabled = value;
    for (const id of ["model1", "model2", "turns"]) $(id).disabled = value;
    if (!value) promptBox.focus();
  }

  async function callModel(model, messages, signal) {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages }),
      signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data.reply;
  }

  // the prompt goes to model 1, each reply becomes the next model's prompt.
  // each model keeps its own history: its replies are "assistant", the other's "user"
  async function runConversation(initialPrompt) {
    const models = [$("model1").value, $("model2").value];
    const turns = Math.max(1, parseInt($("turns").value, 10) || 1);
    const histories = [[], []];

    if (conversations++ > 0) addDivider("New conversation");
    addMessage("user", "You", initialPrompt);

    controller = new AbortController();
    setRunning(true);
    let prompt = initialPrompt;
    try {
      for (let turn = 0; turn < turns; turn++) {
        const i = turn % 2;
        histories[i].push({ role: "user", content: prompt });

        const pending = addTyping(`[${models[i]}]`, i);
        let reply;
        try {
          reply = await callModel(models[i], histories[i], controller.signal);
        } finally {
          pending.remove();
        }

        histories[i].push({ role: "assistant", content: reply });
        addMessage("model", `[${models[i]}]`, reply || "(empty reply)", i);
        prompt = reply;
      }
    } catch (err) {
      if (err.name === "AbortError") addDivider("Stopped");
      else addError(err.message);
    } finally {
      controller = null;
      setRunning(false);
    }
  }

  $("composer").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = promptBox.value.trim();
    if (!text || running) return;
    promptBox.value = "";
    autosize();
    runConversation(text);
  });

  sendButton.addEventListener("click", () => {
    if (running && controller) controller.abort();
  });

  promptBox.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      $("composer").requestSubmit();
    }
  });

  function autosize() {
    promptBox.style.height = "auto";
    promptBox.style.height = `${promptBox.scrollHeight}px`;
  }
  promptBox.addEventListener("input", autosize);

  loadModels();
  promptBox.focus();
</script>
</body>
</html>
