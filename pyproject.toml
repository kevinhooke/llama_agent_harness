[project]
name = "llama-chat-harness"
version = "0.1.0"
description = "Python chat harness for llama.cpp models"
authors = [
    {name = "kevinhooke",email = "kevin.hooke@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry]
packages = [{ include = "harness" }]

[project.scripts]
harness = "harness.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade
